# --- Ecoa local services ---
name: ecoa


# --- settings ---
x-node: &node
  build:
    context: ../..
    dockerfile: node/Dockerfile
  image: ecoa-node:local
  restart: unless-stopped
  environment: &node-env
    NETWORK: ecoa-dev
    PEER_KEY_PATH: /keys/peer.key

x-indexer: &indexer
  build:
    context: ../..
    dockerfile: indexer/Dockerfile
  image: ecoa-indexer:local
  environment: &indexer-env
    DATABASE_URL: postgres://indexer:${INDEXER_DB_PASSWORD:-goodpassword}@postgres:5432/ecoa_indexer?sslmode=disable
    NODE_ADDRS: node-1:50051,node-2:50051,node-3:50051,node-4:50051,node-5:50051
    MODERATORS_FILE: /config/moderators.json
    VERIFIERS_FILE: /config/verifiers.json
    RANKING: ${RANKING:-newest}
    DNS_SERVER: dns:53
  volumes:
    - ./configs/indexer/moderators.json:/config/moderators.json:ro
    - ./configs/indexer/verifiers.json:/config/verifiers.json:ro

x-backend: &backend
  build: ../../backend
  image: ecoa-backend:local
  env_file:
    - path: ../../backend/.env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://backend:${BACKEND_DB_PASSWORD:-goodpassword}@postgres:5432/ecoa_backend
    NODE_ADDRS: node-1:50051,node-2:50051,node-3:50051,node-4:50051,node-5:50051
    # the human verifier's key, for this machine only: anyone with the
    # repository has it (configs/indexer/verifiers.json lists its did:key)
    HUMAN_VERIFIER_SEED: 341203c990162088dd711512907df227606c510bc83404d5f8c38d8c267c728d
    ALTCHA_HMAC_SECRET: ${ALTCHA_HMAC_SECRET:-ecoa-local-dev-altcha-secret}
    INDEXER_URL: http://indexer-serve:8081
    BIND: 0.0.0.0
    PORT: "8000"
    COOKIE_SECURE: "false"


# --- the services ---
services:

  # --- data services ---
  postgres:
    image: postgres:18-alpine
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:-goodpassword}
      INDEXER_DB_PASSWORD: ${INDEXER_DB_PASSWORD:-goodpassword}
    volumes:
      - ./configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./configs/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./data/postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"

  dns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    restart: unless-stopped
    volumes:
      - ./configs/dns:/etc/coredns:ro
    ports:
      - "127.0.0.1:${DNS_PORT:-5353}:53/udp"


  # --- cluster of nodes (5 peered libp2p nodes) ---
  node-1:
    <<: *node
    environment:
      <<: *node-env
      BOOTSTRAP_ADDRS: /dns4/node-2/tcp/4001/p2p/12D3KooWBDfuNroD7Nu9mXbrYAm1H4B3eHwtzsw2Z7UBAVrQCNs7,/dns4/node-3/tcp/4001/p2p/12D3KooWHpQ9ZRanrBMfS62s4vYnvueZDLu4WtcsaCRJCGSGHJvs,/dns4/node-4/tcp/4001/p2p/12D3KooWNHvGYj6AeWAD5UPcYQbEbjUHeMKcigHQFaKFHibofEdp,/dns4/node-5/tcp/4001/p2p/12D3KooWCbcAWoTbziaSX6HYoNyqg6591XeXkXxvgYNBSAZR3BzR
    volumes:
      - ./configs/nodes/node-1.key:/keys/peer.key:ro
      - ./data/node-1:/data
    ports:
      - "127.0.0.1:4001:4001"
      - "127.0.0.1:50051:50051"

  node-2:
    <<: *node
    environment:
      <<: *node-env
      BOOTSTRAP_ADDRS: /dns4/node-1/tcp/4001/p2p/12D3KooWScQpy5eMWGnq9bTa1w2b2S5zQRtvGc9e6HHW2BRtzPH4,/dns4/node-3/tcp/4001/p2p/12D3KooWHpQ9ZRanrBMfS62s4vYnvueZDLu4WtcsaCRJCGSGHJvs,/dns4/node-4/tcp/4001/p2p/12D3KooWNHvGYj6AeWAD5UPcYQbEbjUHeMKcigHQFaKFHibofEdp,/dns4/node-5/tcp/4001/p2p/12D3KooWCbcAWoTbziaSX6HYoNyqg6591XeXkXxvgYNBSAZR3BzR
    volumes:
      - ./configs/nodes/node-2.key:/keys/peer.key:ro
      - ./data/node-2:/data
    ports:
      - "127.0.0.1:4002:4001"
      - "127.0.0.1:50052:50051"

  node-3:
    <<: *node
    environment:
      <<: *node-env
      BOOTSTRAP_ADDRS: /dns4/node-1/tcp/4001/p2p/12D3KooWScQpy5eMWGnq9bTa1w2b2S5zQRtvGc9e6HHW2BRtzPH4,/dns4/node-2/tcp/4001/p2p/12D3KooWBDfuNroD7Nu9mXbrYAm1H4B3eHwtzsw2Z7UBAVrQCNs7,/dns4/node-4/tcp/4001/p2p/12D3KooWNHvGYj6AeWAD5UPcYQbEbjUHeMKcigHQFaKFHibofEdp,/dns4/node-5/tcp/4001/p2p/12D3KooWCbcAWoTbziaSX6HYoNyqg6591XeXkXxvgYNBSAZR3BzR
    volumes:
      - ./configs/nodes/node-3.key:/keys/peer.key:ro
      - ./data/node-3:/data
    ports:
      - "127.0.0.1:4003:4001"
      - "127.0.0.1:50053:50051"

  node-4:
    <<: *node
    environment:
      <<: *node-env
      BOOTSTRAP_ADDRS: /dns4/node-1/tcp/4001/p2p/12D3KooWScQpy5eMWGnq9bTa1w2b2S5zQRtvGc9e6HHW2BRtzPH4,/dns4/node-2/tcp/4001/p2p/12D3KooWBDfuNroD7Nu9mXbrYAm1H4B3eHwtzsw2Z7UBAVrQCNs7,/dns4/node-3/tcp/4001/p2p/12D3KooWHpQ9ZRanrBMfS62s4vYnvueZDLu4WtcsaCRJCGSGHJvs,/dns4/node-5/tcp/4001/p2p/12D3KooWCbcAWoTbziaSX6HYoNyqg6591XeXkXxvgYNBSAZR3BzR
    volumes:
      - ./configs/nodes/node-4.key:/keys/peer.key:ro
      - ./data/node-4:/data
    ports:
      - "127.0.0.1:4004:4001"
      - "127.0.0.1:50054:50051"

  node-5:
    <<: *node
    environment:
      <<: *node-env
      BOOTSTRAP_ADDRS: /dns4/node-1/tcp/4001/p2p/12D3KooWScQpy5eMWGnq9bTa1w2b2S5zQRtvGc9e6HHW2BRtzPH4,/dns4/node-2/tcp/4001/p2p/12D3KooWBDfuNroD7Nu9mXbrYAm1H4B3eHwtzsw2Z7UBAVrQCNs7,/dns4/node-3/tcp/4001/p2p/12D3KooWHpQ9ZRanrBMfS62s4vYnvueZDLu4WtcsaCRJCGSGHJvs,/dns4/node-4/tcp/4001/p2p/12D3KooWNHvGYj6AeWAD5UPcYQbEbjUHeMKcigHQFaKFHibofEdp
    volumes:
      - ./configs/nodes/node-5.key:/keys/peer.key:ro
      - ./data/node-5:/data
    ports:
      - "127.0.0.1:4005:4001"
      - "127.0.0.1:50055:50051"

  # --- the indexer ---
  indexer-migrate:
    <<: *indexer
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  indexer-project:
    <<: *indexer
    command: ["project"]
    restart: unless-stopped
    depends_on:
      indexer-migrate:
        condition: service_completed_successfully
      dns:
        condition: service_started

  indexer-serve:
    <<: *indexer
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      indexer-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8081"

  # --- the backend ---
  backend-migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/system/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      node-1:
        condition: service_started
      indexer-serve:
        condition: service_started
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  # --- the frontend ---
  frontend:
    build: ../../frontend
    image: ecoa-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
