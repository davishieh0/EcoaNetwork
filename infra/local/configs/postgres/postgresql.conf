# --- Postgres config ---
# accept connections from outside the container
listen_addresses = '*'

# every timestamp is stored and shown in UTC, whatever the host's zone is
timezone = 'UTC'
log_timezone = 'UTC'

# passwords are never stored or sent as md5
password_encryption = 'scram-sha-256'

# log to the container's output, where `docker compose logs` reads it
logging_collector = off

# log the statements that take longer than this, in ms
log_min_duration_statement = 500
