# --- Alembic config ---
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# migrations sort by date in the folder: 20260101_1200_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# NOTE: there is no database url here on purpose. migrations/env.py reads
# DATABASE_URL the same way the service does, so no password lives in git.



# --- generated files ---
# every new migration is linted and formatted the moment it is written
[post_write_hooks]
hooks = ruff_fix, ruff_format

ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/bin/ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME

ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

# --- logging ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
