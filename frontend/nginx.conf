# The built site, and /api passed on to the backend on the same origin.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # the API: the backend, as Vite's proxy does in development
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # built assets carry a hash in their name, so they never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # every other path is a route of the single-page app
    location / {
        try_files $uri /index.html;
    }
}
